<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Predictor</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #17202a;
    }

    header {
      background: #0b5ed7;
      color: white;
      padding: 22px 18px;
      text-align: center;
    }

    header h1 {
      font-size: 25px;
    }

    header p {
      margin-top: 6px;
      opacity: 0.9;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 18px;
    }

    .section-title {
      margin: 10px 0 15px;
      font-size: 20px;
    }

    .match-card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .league {
      color: #0b5ed7;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 14px;
    }

    .teams {
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      gap: 10px;
    }

    .team {
      width: 42%;
      font-weight: bold;
      font-size: 16px;
    }

    .vs {
      font-weight: bold;
      color: #777;
    }

    .prediction {
      margin-top: 18px;
      background: #f1f5f9;
      border-radius: 10px;
      padding: 12px;
    }

    .prediction-title {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .probabilities {
      display: flex;
      justify-content: space-between;
      text-align: center;
    }

    .probability {
      flex: 1;
    }

    .number {
      font-size: 20px;
      font-weight: bold;
      color: #0b5ed7;
    }

    .label {
      font-size: 12px;
      color: #666;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 9px;
      padding: 12px;
      margin-top: 15px;
      background: #0b5ed7;
      color: white;
      font-size: 15px;
      font-weight: bold;
    }

    button:active {
      transform: scale(0.98);
    }

    .info {
      margin-top: 18px;
      background: white;
      padding: 16px;
      border-radius: 12px;
    }

    .info p {
      margin: 8px 0;
    }
  </style>
</head>

<body>

  <header>
    <h1>⚽ Football Predictor</h1>
    <p>Match analysis & statistical predictions</p>
  </header>

  <main class="container">

    <h2 class="section-title">Today's Matches</h2>

    <div class="match-card">

      <div class="league">Premier League</div>

      <div class="teams">
        <div class="team">Arsenal</div>
        <div class="vs">VS</div>
        <div class="team">Chelsea</div>
      </div>

      <div class="prediction">

        <div class="prediction-title">
          Prediction
        </div>

        <div class="probabilities">

          <div class="probability">
            <div class="number">54%</div>
            <div class="label">Home Win</div>
          </div>

          <div class="probability">
            <div class="number">25%</div>
            <div class="label">Draw</div>
          </div>

          <div class="probability">
            <div class="number">21%</div>
            <div class="label">Away Win</div>
          </div>

        </div>

      </div>

      <button onclick="analyzeMatch()">
        ANALYZE MATCH
      </button>

    </div>

    <div class="info">
      <h3>📊 Analysis</h3>
      <p>⚽ Goals & recent form</p>
      <p>🏠 Home advantage</p>
      <p>🤕 Injuries & suspensions</p>
      <p>📈 Head-to-head record</p>
      <p>🤖 Prediction model</p>
    </div>

  </main>

  <script>
    function analyzeMatch() {
      alert("Match analysis will be connected to real football data soon!");
    }
  </script>

</body>
</html>
