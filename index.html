<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football Predictor Pro</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#07111f;
    color:#edf4ff;
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:18px;
}

header{
    text-align:center;
    padding:20px 10px;
}

header h1{
    margin:0;
    font-size:30px;
}

header p{
    color:#91a2ba;
    margin-top:8px;
}

.card{
    background:#101c2d;
    border:1px solid #263750;
    border-radius:14px;
    padding:18px;
    margin-bottom:18px;
}

.card h2{
    margin-top:0;
}

button{
    background:#2563eb;
    color:white;
    border:0;
    border-radius:8px;
    padding:11px 16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.88;
}

input{
    width:100%;
    background:#091423;
    color:white;
    border:1px solid #344761;
    border-radius:8px;
    padding:12px;
    margin-top:6px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.injury-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.result-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.result-box{
    background:#0a1525;
    border:1px solid #263750;
    border-radius:10px;
    padding:15px;
    text-align:center;
}

.result-box h3{
    color:#91a2ba;
    font-size:12px;
    margin:0 0 8px;
}

.big{
    font-size:27px;
    font-weight:bold;
}

.status{
    color:#9cafc7;
    font-size:14px;
    margin-top:12px;
}

.small{
    color:#8295ae;
    font-size:12px;
    line-height:1.5;
}

.fixture{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    background:#0a1525;
    border:1px solid #263750;
    border-radius:10px;
    padding:13px;
    margin-top:10px;
}

.fixture-date{
    color:#8396b0;
    font-size:12px;
    margin-bottom:5px;
}

.fixture-match{
    font-weight:bold;
    line-height:1.45;
}

.stats-table{
    width:100%;
    border-collapse:collapse;
    margin-top:12px;
}

.stats-table th,
.stats-table td{
    padding:9px 6px;
    border-bottom:1px solid #263750;
    text-align:center;
}

.stats-table th{
    color:#91a2ba;
    font-size:12px;
}

.form{
    font-weight:bold;
    letter-spacing:2px;
}

.section-title{
    margin:22px 0 10px;
    font-weight:bold;
}

.score-list{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.score{
    background:#0a1525;
    border:1px solid #263750;
    border-radius:9px;
    padding:14px;
    text-align:center;
}

.summary{
    background:#0a1525;
    border-radius:9px;
    padding:13px;
    margin-top:9px;
    line-height:1.55;
}

.badge{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    background:#263750;
    color:#c5d1e0;
    font-size:12px;
}

.confidence{
    text-align:center;
    padding:16px;
    background:#0a1525;
    border-radius:10px;
    margin-top:12px;
}
