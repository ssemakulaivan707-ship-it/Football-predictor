<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Predictor</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #08111f;
  color: #fff;
}

.container {
  width: 94%;
  max-width: 900px;
  margin: auto;
  padding: 18px 0 40px;
}

h1 {
  text-align: center;
  margin: 5px 0 4px;
  font-size: 28px;
}

.subtitle {
  text-align: center;
  color: #9fb0c7;
  margin-bottom: 20px;
}

.card {
  background: #101c2d;
  border: 1px solid #20324a;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 15px;
}

label {
  display: block;
  margin-bottom: 7px;
  color: #b9c8dc;
  font-size: 14px;
}

select,
input {
  width: 100%;
  padding: 13px;
  border-radius: 9px;
  border: 1px solid #31445f;
  background: #0a1423;
  color: white;
  font-size: 15px;
}

.match-title {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  margin: 5px 0;
}

.match-date {
  text-align: center;
  color: #94a6bd;
  font-size: 13px;
}

.form-title {
  font-weight: bold;
  margin-bottom: 12px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.form-box {
  background: #0a1423;
  border-radius: 10px;
  padding: 13px;
  text-align: center;
}

.team-name {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 10px;
}

.form-row {
  display: flex;
  justify-content: center;
  gap: 5px;
}

.form-letter {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 13px;
}

.win {
  background: #16a34a;
}

.loss {
  background: #dc2626;
}

.draw {
  background: white;
  color: #111;
}

.section-title {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 12px;
}

.result-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.result-box {
  background: #0a1423;
  padding: 12px 7px;
  border-radius: 9px;
  text-align: center;
}

.result-name {
  font-size: 12px;
  color: #aebed1;
}

.result-value {
  font-size: 21px;
  font-weight: bold;
  margin-top: 5px;
}

.hot {
  border: 2px solid #ff9f1c;
  background: linear-gradient(135deg, #211708, #151c29);
  text-align: center;
}

.hot-title {
  color: #ffb52e;
  font-size: 26px;
  font-weight: bold;
}

.hot-name {
  font-size: 22px;
  font-weight: bold;
  margin: 8px 0;
}

.hot-percent {
  font-size: 32px;
  font-weight: bold;
}

.hot-note {
  color: #9daec3;
  font-size: 12px;
  margin-top: 7px;
}

.score-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.score {
  background: #0a1423;
  padding: 13px;
  border-radius: 9px;
  text-align: center;
  font-size: 18px;
  font-weight: bold;
}

.stats {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.stats th,
.stats td {
  padding: 9px 5px;
  border-bottom: 1px solid #24364d;
  text-align: center;
}

.stats th {
  color: #9fb1c8;
}

.loading {
  text-align: center;
  color: #9fb1c8;
  padding: 15px;
}

.error {
  color: #ff7777;
  text-align: center;
  padding: 10px;
}

details {
  margin-top: 10px;
}

summary {
  cursor: pointer;
  color: #9fb9d6;
  padding: 8px 0;
}

.injury-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.small {
  color: #91a4bc;
  font-size: 12px;
}

@media(max-width:600px) {
  .result-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .score-grid {
    grid-template-columns: repeat(3, 1fr);
  }

  .form-grid {
    grid-template-columns: 1fr 1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>⚽ Football Predictor</h1>

  <div class="subtitle">
    Choose a league and match — analysis appears automatically
  </div>

  <!-- LEAGUE -->
  <div class="card">

    <label>Select League</label>

    <select id="leagueSelect">
      <optgroup label="🏴 England">
        <option value="PL">Premier League</option>
        <option value="ELC">Championship</option>
      </optgroup>

      <optgroup label="🇪🇸 Spain">
        <option value="PD">La Liga</option>
        <option value="SD">Segunda Division</option>
      </optgroup>

      <optgroup label="🇩🇪 Germany">
        <option value="BL1">Bundesliga</option>
        <option value="BL2">2. Bundesliga</option>
      </optgroup>

      <optgroup label="🇮🇹 Italy">
        <option value="SA">Serie A</option>
        <option value="SB">Serie B</option>
      </optgroup>

      <optgroup label="🇫🇷 France">
        <option value="FL1">Ligue 1</option>
        <option value="FL2">Ligue 2</option>
      </optgroup>

      <optgroup label="🇳🇱 Netherlands">
        <option value="DED">Eredivisie</option>
      </optgroup>

      <optgroup label="🌍 Europe">
        <option value="CL">Champions League</option>
      </optgroup>
    </select>

  </div>

  <!-- MATCH -->
  <div class="card">

    <label>Select Match</label>

    <select id="matchSelect">
      <option value="">Loading matches...</option>
    </select>

    <div id="matchInfo" style="margin-top:15px;"></div>

  </div>

  <div id="analysis"></div>

</div>

<script>

let currentMatches = [];

const leagueSelect = document.getElementById("leagueSelect");
const matchSelect = document.getElementById("matchSelect");
const matchInfo = document.getElementById("matchInfo");
const analysis = document.getElementById("analysis");


// -----------------------------
// LOAD FIXTURES
// -----------------------------

async function loadFixtures() {

  matchSelect.innerHTML =
    '<option value="">Loading matches...</option>';

  matchInfo.innerHTML = "";
  analysis.innerHTML = "";

  try {

    const league = leagueSelect.value;

    const response = await fetch(
      "/api/football?league=" +
      encodeURIComponent(league) +
      "&t=" +
      Date.now(),
      {
        cache: "no-store"
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "Could not load matches"
      );
    }

    currentMatches = data.matches || [];

    const upcoming = currentMatches
      .filter(m =>
        m.status !== "FINISHED" &&
        m.homeTeam &&
        m.awayTeam
      )
      .sort(
        (a,b) =>
        new Date(a.utcDate) -
        new Date(b.utcDate)
      );

    if (!upcoming.length) {

      matchSelect.innerHTML =
        '<option value="">No upcoming matches found</option>';

      return;
    }

    matchSelect.innerHTML =
      '<option value="">Choose a match</option>';

    upcoming.forEach((match, index) => {

      const option =
        document.createElement("option");

      option.value = match.id;

      option.textContent =
        match.homeTeam.name +
        " vs " +
        match.awayTeam.name;

      matchSelect.appendChild(option);

    });

    // Store upcoming matches
    matchSelect._fixtures = upcoming;

  } catch (error) {

    matchSelect.innerHTML =
      '<option value="">Error loading matches</option>';

    analysis.innerHTML =
      '<div class="card error">' +
      error.message +
      '</div>';
  }
}


// -----------------------------
// TEAM NAME
// -----------------------------

function sameTeam(a,b) {

  if (!a || !b) return false;

  return (
    a.toLowerCase().trim() ===
    b.toLowerCase().trim()
  );
}


// -----------------------------
// TEAM FORM
// -----------------------------

function getTeamForm(teamName) {

  const games = currentMatches
    .filter(m => m.status === "FINISHED")
    .filter(m =>
      sameTeam(m.homeTeam?.name, teamName) ||
      sameTeam(m.awayTeam?.name, teamName)
    )
    .sort(
      (a,b) =>
      new Date(b.utcDate) -
      new Date(a.utcDate)
    )
    .slice(0,5);

  return games.map(match => {

    const home = match.homeTeam.name;
    const away = match.awayTeam.name;

    const hg = match.score.fullTime.home ?? 0;
    const ag = match.score.fullTime.away ?? 0;

    const isHome = sameTeam(home, teamName);

    const teamGoals =
      isHome ? hg : ag;

    const opponentGoals =
      isHome ? ag : hg;

    if (teamGoals > opponentGoals)
      return "W";

    if (teamGoals < opponentGoals)
      return "L";

    return "D";

  }).reverse();
}


// -----------------------------
// FORM DISPLAY
// -----------------------------

function formHTML(teamName) {

  const form = getTeamForm(teamName);

  if (!form.length) {
    return `
      <div class="form-row">
        <span class="small">No recent data</span>
      </div>
    `;
  }

  return `
    <div class="form-row">
      ${form.map(x => {

        const cls =
          x === "W"
          ? "win"
          : x === "L"
          ? "loss"
          : "draw";

        return `
          <span class="form-letter ${cls}">
            ${x}
          </span>
        `;

      }).join("")}
    </div>
  `;
}


// -----------------------------
// TEAM STATS
// -----------------------------

function getStats(teamName) {

  const games = currentMatches
    .filter(m => m.status === "FINISHED")
    .filter(m =>
      sameTeam(m.homeTeam?.name, teamName) ||
      sameTeam(m.awayTeam?.name, teamName)
    )
    .sort(
      (a,b) =>
      new Date(b.utcDate) -
      new Date(a.utcDate)
    )
    .slice(0,5);

  let wins = 0;
  let draws = 0;
  let losses = 0;
  let gf = 0;
  let ga = 0;
  let cleanSheets = 0;
  let btts = 0;
  let over25 = 0;

  games.forEach(match => {

    const isHome =
      sameTeam(
        match.homeTeam.name,
        teamName
      );

    const homeGoals =
      match.score.fullTime.home ?? 0;

    const awayGoals =
      match.score.fullTime.away ?? 0;

    const teamGoals =
      isHome ? homeGoals : awayGoals;

    const opponentGoals =
      isHome ? awayGoals : homeGoals;

    gf += teamGoals;
    ga += opponentGoals;

    if (teamGoals > opponentGoals)
      wins++;

    else if (teamGoals === opponentGoals)
      draws++;

    else
      losses++;

    if (opponentGoals === 0)
      cleanSheets++;

    if (
      homeGoals > 0 &&
      awayGoals > 0
    )
      btts++;

    if (
      homeGoals + awayGoals > 2
    )
      over25++;

  });

  return {

    games: games.length,
    wins,
    draws,
    losses,
    gf,
    ga,

    avgGF:
      games.length
      ? gf / games.length
      : 1,

    avgGA:
      games.length
      ? ga / games.length
      : 1,

    cleanSheets,
    btts,
    over25
  };
}


// -----------------------------
// POISSON
// -----------------------------

function poisson(k, lambda) {

  let result =
    Math.exp(-lambda);

  for (
    let i = 1;
    i <= k;
    i++
  ) {
    result *= lambda / i;
  }

  return result;
}


// -----------------------------
// ANALYSIS
// -----------------------------

function analyzeMatch(match) {

  if (!match) return;

  const home =
    match.homeTeam.name;

  const away =
    match.awayTeam.name;

  const hs = getStats(home);
  const as = getStats(away);

  let homeXG =
    (hs.avgGF + as.avgGA) / 2;

  let awayXG =
    (as.avgGF + hs.avgGA) / 2;

  // Home advantage
  homeXG *= 1.08;

  // Form adjustment
  homeXG *=
    1 + ((hs.wins - 2) * 0.04);

  awayXG *=
    1 + ((as.wins - 2) * 0.04);

  // Keep values sensible
  homeXG =
    Math.max(
      0.15,
      Math.min(5, homeXG)
    );

  awayXG =
    Math.max(
      0.15,
      Math.min(5, awayXG)
    );

  const matrix = [];

  let homeWin = 0;
  let draw = 0;
  let awayWin = 0;

  let over25 = 0;
  let under25 = 0;

  let bttsYes = 0;
  let bttsNo = 0;

  let homeScore = 0;
  let awayScore = 0;

  let homeClean = 0;
  let awayClean = 0;

  for (
    let h = 0;
    h <= 8;
    h++
  ) {

    for (
      let a = 0;
      a <= 8;
      a++
    ) {

      const probability =
        poisson(h, homeXG) *
        poisson(a, awayXG);

      matrix.push({
        h,
        a,
        probability
      });

      if (h > a)
        homeWin += probability;

      else if (h === a)
        draw += probability;

      else
        awayWin += probability;

      if (h + a > 2)
        over25 += probability;

      else
        under25 += probability;

      if (h > 0 && a > 0)
        bttsYes += probability;

      else
        bttsNo += probability;

      if (h > 0)
        homeScore += probability;

      if (a > 0)
        awayScore += probability;

      if (a === 0)
        homeClean += probability;

      if (h === 0)
        awayClean += probability;
    }
  }

  const normalize = x =>
    Math.round(x * 100);

  const outcomes = [

    {
      name: "Home win",
      value: homeWin
    },

    {
      name: "Draw",
      value: draw
    },

    {
      name: "Away win",
      value: awayWin
    },

    {
      name: "Over 2.5",
      value: over25
    },

    {
      name: "Under 2.5",
      value: under25
    },

    {
      name: "Both score",
      value: bttsYes
    },

    {
      name: "Both don't score",
      value: bttsNo
    },

    {
      name: home + " scores",
      value: homeScore
    },

    {
      name: away + " scores",
      value: awayScore
    }

  ];

  // Strongest model signal
  const hot =
    outcomes.reduce(
      (best,current) =>
        current.value > best.value
        ? current
        : best
    );

  // Top exact scores
  matrix.sort(
    (a,b) =>
    b.probability -
    a.probability
  );

  const topScores =
    matrix.slice(0,3);

  displayAnalysis(
    home,
    away,
    hs,
    as,
    homeXG,
    awayXG,
    outcomes,
    hot,
    topScores,
    {
      homeClean,
      awayClean
    }
  );
}


// -----------------------------
// DISPLAY
// -----------------------------

function displayAnalysis(
  home,
  away,
  hs,
  as,
  homeXG,
  awayXG,
  outcomes,
  hot,
  topScores,
  clean
) {

  analysis.innerHTML = `

    <!-- FORM -->

    <div class="card">

      <div class="section-title">
        📊 Recent Form
      </div>

      <div class="form-grid">

        <div class="form-box">

          <div class="team-name">
            ${home}
          </div>

          ${formHTML(home)}

        </div>

        <div class="form-box">

          <div class="team-name">
            ${away}
          </div>

          ${formHTML(away)}

        </div>

      </div>

      <div class="small" style="margin-top:10px;text-align:center;">
        🟩 Win &nbsp; 🟥 Loss &nbsp; ⬜ Draw
      </div>

    </div>


    <!-- HOT -->

    <div class="card hot">

      <div class="hot-title">
        🔥 HOT
      </div>

      <div class="hot-name">
        ${hot.name}
      </div>

      <div class="hot-percent">
        ${Math.round(hot.value * 100)}%
      </div>

      <div class="hot-note">
        Strongest calculated signal from the available model.
        Not a guaranteed result.
      </div>

    </div>


    <!-- POSSIBLE OUTCOMES -->

    <div class="card">

      <div class="section-title">
        🎯 Possible Outcomes
      </div>

      <div class="result-grid">

        ${outcomes.map(o => `

          <div class="result-box">

            <div class="result-name">
              ${o.name}
            </div>

            <div class="result-value">
              ${Math.round(o.value * 100)}%
            </div>

          </div>

        `).join("")}

      </div>

    </div>


    <!-- LIKELY SCORES -->

    <div class="card">

      <div class="section-title">
        ⚽ Likely Scores
      </div>

      <div class="score-grid">

        ${topScores.map(s => `

          <div class="score">

            ${s.h} - ${s.a}

            <div class="small">
              ${Math.round(
                s.probability * 100
              )}%
            </div>

          </div>

        `).join("")}

      </div>

    </div>


    <!-- TEAM NUMBERS -->

    <div class="card">

      <div class="section-title">
        📈 Last 5 Games
      </div>

      <table class="stats">

        <tr>
          <th></th>
          <th>${home}</th>
          <th>${away}</th>
        </tr>

        <tr>
          <td>Wins</td>
          <td>${hs.wins}</td>
          <td>${as.wins}</td>
        </tr>

        <tr>
          <td>Draws</td>
          <td>${hs.draws}</td>
          <td>${as.draws}</td>
        </tr>

        <tr>
          <td>Losses</td>
          <td>${hs.losses}</td>
          <td>${as.losses}</td>
        </tr>

        <tr>
          <td>Goals For</td>
          <td>${hs.gf}</td>
          <td>${as.gf}</td>
        </tr>

        <tr>
          <td>Goals Against</td>
          <td>${hs.ga}</td>
          <td>${as.ga}</td>
        </tr>

        <tr>
          <td>Clean Sheets</td>
          <td>${hs.cleanSheets}</td>
          <td>${as.cleanSheets}</td>
        </tr>

        <tr>
          <td>BTTS</td>
          <td>${hs.btts}/5</td>
          <td>${as.btts}/5</td>
        </tr>

        <tr>
          <td>Over 2.5</td>
          <td>${hs.over25}/5</td>
          <td>${as.over25}/5</td>
        </tr>

      </table>

    </div>


    <!-- EXPECTED GOALS -->

    <div class="card">

      <div class="section-title">
        📊 Expected Goals
      </div>

      <div class="result-grid">

        <div class="result-box">
          <div class="result-name">
            ${home}
          </div>
          <div class="result-value">
            ${homeXG.toFixed(2)}
          </div>
        </div>

        <div class="result-box">
          <div class="result-name">
            Total xG
          </div>
          <div class="result-value">
            ${(homeXG + awayXG).toFixed(2)}
          </div>
        </div>

        <div class="result-box">
          <div class="result-name">
            ${away}
          </div>
          <div class="result-value">
            ${awayXG.toFixed(2)}
          </div>
        </div>

      </div>

    </div>


    <div class="card">

      <div class="small" style="text-align:center;">
        ⚠️ Predictions are statistical estimates based on available
        match data. They are not guaranteed results.
      </div>

    </div>

  `;
}


// -----------------------------
// MATCH SELECTED
// -----------------------------

matchSelect.addEventListener(
  "change",
  function() {

    const id =
      Number(this.value);

    const fixtures =
      this._fixtures || [];

    const match =
      fixtures.find(
        m => m.id === id
      );

    if (!match) {

      matchInfo.innerHTML = "";
      analysis.innerHTML = "";

      return;
    }

    const date =
      new Date(
        match.utcDate
      ).toLocaleString();

    matchInfo.innerHTML = `

      <div class="match-title">
        ${match.homeTeam.name}
        <br>
        vs
        <br>
        ${match.awayTeam.name}
      </div>

      <div class="match-date">
        ${date}
      </div>

    `;

    // Automatic analysis
    analyzeMatch(match);

  }
);


// -----------------------------
// CHANGE LEAGUE
// -----------------------------

leagueSelect.addEventListener(
  "change",
  loadFixtures
);


// -----------------------------
// START
// -----------------------------

loadFixtures();

</script>

</body>
</html>
