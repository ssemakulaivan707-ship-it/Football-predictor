<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚽ Football Predictor Pro</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b1220;
      color: #ffffff;
    }

    .container {
      width: 94%;
      max-width: 1100px;
      margin: auto;
      padding: 20px 0 40px;
    }

    header {
      text-align: center;
      margin-bottom: 22px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      color: #9ca9bd;
      margin-top: 8px;
    }

    .card {
      background: #121c2e;
      border: 1px solid #26344d;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.18);
    }

    .card h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .three-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .four-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #aebbd0;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 9px;
      border: 1px solid #34445f;
      background: #0b1424;
      color: white;
      outline: none;
    }
