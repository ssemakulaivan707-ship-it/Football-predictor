<script>

let currentMatches = [];

const $ = id => document.getElementById(id);

function clamp(value,min,max){
  return Math.max(min,Math.min(max,value));
}

function percentage(value){
  return Math.round(value * 100) + "%";
}

function poissonProbability(lambda,k){
  let factorial=1;

  for(let i=2;i<=k;i++){
    factorial*=i;
  }

  return Math.exp(-lambda) *
         Math.pow(lambda,k) /
         factorial;
}

function normalizeTeamName(name){
  return String(name || "")
    .toLowerCase()
    .replace(/\b(fc|afc|cf)\b/g,"")
    .replace(/[^a-z0-9]/g,"");
}

/* =========================
   FIXTURES
========================= */

async function loadFixtures(){

  $("fixturesStatus").textContent="Loading real fixtures...";
  $("fixturesList").innerHTML="";

  try{

    const response=await fetch("/api/football");

    const data=await response.json();

    if(!response.ok){
      throw new Error(data.error || "Could not load fixtures");
    }

    currentMatches=data.matches || [];

    const now=new Date();

    const fixtures=currentMatches
      .filter(match =>
        (match.status==="SCHEDULED" ||
         match.status==="TIMED") &&
        new Date(match.utcDate)>=now
      )
      .sort((a,b)=>
        new Date(a.utcDate)-new Date(b.utcDate)
      )
      .slice(0,20);

    if(!fixtures.length){

      $("fixturesStatus").textContent=
        "No upcoming Premier League fixtures found.";

      return;
    }

    $("fixturesStatus").textContent=
      fixtures.length+" upcoming fixtures";

    fixtures.forEach(match=>{

      const div=document.createElement("div");
      div.className="fixture";

      const date=new Date(match.utcDate);

      div.innerHTML=`
        <div class="fixture-info">
          <strong>${match.homeTeam.name}</strong>
          vs
          <strong>${match.awayTeam.name}</strong>
          <div class="small">
            ${date.toLocaleDateString()}
            ${date.toLocaleTimeString([],{
              hour:"2-digit",
              minute:"2-digit"
            })}
          </div>
        </div>

        <button>
          🔮 Predict
        </button>
      `;

      div.querySelector("button").onclick=()=>{
        selectFixture(
          match.homeTeam.name,
          match.awayTeam.name
        );
      };

      $("fixturesList").appendChild(div);

    });

  }catch(error){

    $("fixturesStatus").textContent=
      "Fixture error: "+error.message;

  }

}

async function selectFixture(home,away){

  $("homeTeam").value=home;
  $("awayTeam").value=away;

  $("injuryApplied").value="0";

  $("homeAttackInjuries").value=0;
  $("awayAttackInjuries").value=0;
  $("homeDefenseInjuries").value=0;
  $("awayDefenseInjuries").value=0;

  $("injuryStatus").textContent=
    "No injury adjustment applied.";

  await loadTeamStatistics(home,away);

  analyze();

  $("results").scrollIntoView({
    behavior:"smooth"
  });

}

/* =========================
   TEAM STATISTICS
========================= */

async function loadTeamStatistics(home,away){

  $("teamStatsStatus").textContent=
    "Loading last 5 finished matches...";

  try{

    if(!currentMatches.length){

      const response=await fetch("/api/football");

      const data=await response.json();

      currentMatches=data.matches || [];

    }

    const homeName=normalizeTeamName(home);
    const awayName=normalizeTeamName(away);

    const finished=currentMatches.filter(
      match=>match.status==="FINISHED"
    );

    function getTeamMatches(team){

      const normalized=normalizeTeamName(team);

      return finished
        .filter(match=>
          normalizeTeamName(match.homeTeam.name)===normalized ||
          normalizeTeamName(match.awayTeam.name)===normalized
        )
        .sort((a,b)=>
          new Date(b.utcDate)-new Date(a.utcDate)
        )
        .slice(0,5);
    }

    const homeMatches=getTeamMatches(home);
    const awayMatches=getTeamMatches(away);

    const homeStats=calculateStats(homeName,homeMatches);
    const awayStats=calculateStats(awayName,awayMatches);

    displayStats(
      "home",
      home,
      homeStats
    );

    displayStats(
      "away",
      away,
      awayStats
    );

    $("teamStatsStatus").textContent=
      "Statistics based on recent finished matches.";

  }catch(error){

    $("teamStatsStatus").textContent=
      "Statistics error: "+error.message;

  }

}

function calculateStats(team,matches){

  let wins=0;
  let draws=0;
  let losses=0;
  let gf=0;
  let ga=0;
  let clean=0;
  let btts=0;
  let over=0;

  const form=[];

  matches.forEach(match=>{

    const home=normalizeTeamName(match.homeTeam.name);
    const away=normalizeTeamName(match.awayTeam.name);

    const hg=match.score.fullTime.home ?? 0;
    const ag=match.score.fullTime.away ?? 0;

    let scored;
    let conceded;

    if(home===team){

      scored=hg;
      conceded=ag;

      if(hg>ag){
        wins++;
        form.push("W");
      }else if(hg===ag){
        draws++;
        form.push("D");
      }else{
        losses++;
        form.push("L");
      }

    }else{

      scored=ag;
      conceded=hg;

      if(ag>hg){
        wins++;
        form.push("W");
      }else if(ag===hg){
        draws++;
        form.push("D");
      }else{
        losses++;
        form.push("L");
      }

    }

    gf+=scored;
    ga+=conceded;

    if(conceded===0){
      clean++;
    }

    if(scored>0 && conceded>0){
      btts++;
    }

    if(scored+conceded>2){
      over++;
    }

  });

  const games=matches.length || 1;

  return {
    wins,
    draws,
    losses,
    gf,
    ga,
    avg:gf/games,
    clean:clean/games,
    btts:btts/games,
    over:over/games,
    form:form.join(" ")
  };

}

function displayStats(side,team,stats){

  $(side==="home" ?
    "statsHomeTeam":"statsAwayTeam"
  ).textContent=team;

  $(side==="home" ?
    "homeWinsDisplay":"awayWinsDisplay"
  ).textContent=stats.wins;

  $(side==="home" ?
    "homeDrawsDisplay":"awayDrawsDisplay"
  ).textContent=stats.draws;

  $(side==="home" ?
    "homeLossesDisplay":"awayLossesDisplay"
  ).textContent=stats.losses;

  $(side==="home" ?
    "homeGFDisplay":"awayGFDisplay"
  ).textContent=stats.gf;

  $(side==="home" ?
    "homeGADisplay":"awayGADisplay"
  ).textContent=stats.ga;

  $(side==="home" ?
    "homeAvgDisplay":"awayAvgDisplay"
  ).textContent=stats.avg.toFixed(2);

  $(side==="home" ?
    "homeCleanDisplay":"awayCleanDisplay"
  ).textContent=percentage(stats.clean);

  $(side==="home" ?
    "homeBTTSDisplay":"awayBTTSDisplay"
  ).textContent=percentage(stats.btts);

  $(side==="home" ?
    "homeOverDisplay":"awayOverDisplay"
  ).textContent=percentage(stats.over);

  $(side==="home" ?
    "homeForm":"awayForm"
  ).textContent=stats.form || "-";

  if(side==="home"){

    $("homeWins").value=
      stats.wins || 2;

    $("homeGF").value=
      stats.avg || 1.5;

    $("homeGA").value=
      stats.ga/(stats.wins+stats.draws+stats.losses || 1) || 1.5;

  }else{

    $("awayWins").value=
      stats.wins || 2;

    $("awayGF").value=
      stats.avg || 1.5;

    $("awayGA").value=
      stats.ga/(stats.wins+stats.draws+stats.losses || 1) || 1.5;

  }

}

  const home=$("homeTeam").
