<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Football Predictor</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#07101d;
 color:#fff;
}

.container{
 width:94%;
 max-width:900px;
 margin:auto;
 padding:18px 0 40px;
}

h1{
 text-align:center;
 margin:5px 0;
 font-size:28px;
}

.subtitle{
 text-align:center;
 color:#91a4bb;
 font-size:13px;
 margin-bottom:18px;
}

.card{
 background:#101c2c;
 border:1px solid #22354e;
 border-radius:15px;
 padding:16px;
 margin-bottom:15px;
 box-shadow:0 5px 20px rgba(0,0,0,.18);
}

label{
 display:block;
 color:#aebfd3;
 font-size:13px;
 margin-bottom:7px;
}

select,input{
 width:100%;
 padding:14px;
 border-radius:10px;
 border:1px solid #30455f;
 background:#091422;
 color:white;
 font-size:15px;
 outline:none;
}

select:focus,input:focus{
 border-color:#4d8cff;
}

.section-title{
 font-size:18px;
 font-weight:bold;
 margin-bottom:13px;
}

/* MATCH PICKER */

.match-button{
 width:100%;
 background:#091422;
 color:white;
 border:1px solid #30455f;
 border-radius:11px;
 padding:15px;
 text-align:left;
 font-size:15px;
 cursor:pointer;
}

.match-button span{
 display:block;
 color:#8397af;
 font-size:12px;
 margin-top:5px;
}

.match-modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.78);
 display:none;
 align-items:flex-end;
 justify-content:center;
 z-index:1000;
}

.match-modal.show{
 display:flex;
}

.match-panel{
 width:100%;
 max-width:650px;
 max-height:88vh;
 background:#0d1928;
 border:1px solid #263b55;
 border-radius:20px 20px 0 0;
 padding:17px;
 animation:up .2s ease;
}

@keyframes up{
 from{transform:translateY(100%)}
 to{transform:translateY(0)}
}

.modal-head{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:12px;
}

.modal-head b{
 font-size:19px;
}

.close{
 border:0;
 background:#24354b;
 color:white;
 width:35px;
 height:35px;
 border-radius:50%;
 font-size:20px;
}

.search{
 margin-bottom:12px;
}

.match-list{
 overflow-y:auto;
 max-height:62vh;
}

.match-item{
 width:100%;
 border:1px solid #263b55;
 background:#111f31;
 color:white;
 padding:14px;
 border-radius:11px;
 margin-bottom:8px;
 text-align:left;
 cursor:pointer;
}

.match-item:active{
 background:#1b304a;
}

.match-teams{
 font-weight:bold;
 font-size:15px;
}

.match-time{
 color:#8ea2ba;
 font-size:12px;
 margin-top:5px;
}

/* FORM */

.form-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}

.form-box{
 background:#091422;
 border:1px solid #20344c;
 border-radius:11px;
 padding:12px;
 text-align:center;
}

.team-name{
 font-weight:bold;
 font-size:13px;
 margin-bottom:10px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.form-row{
 display:flex;
 justify-content:center;
 gap:5px;
}

.form-letter{
 width:27px;
 height:27px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:bold;
 font-size:12px;
}

.win{background:#16a34a}
.loss{background:#dc2626}
.draw{background:white;color:#111}

/* HOT */

.hot{
 text-align:center;
 border:2px solid #f59e0b;
 background:linear-gradient(135deg,#211807,#111c2b);
}

.hot-title{
 color:#ffb52e;
 font-size:25px;
 font-weight:bold;
}

.hot-name{
 font-size:22px;
 font-weight:bold;
 margin:8px 0;
}

.hot-percent{
 font-size:32px;
 font-weight:bold;
}

/* OUTCOMES */

.result-grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
}

.result-box{
 background:#091422;
 border:1px solid #20344c;
 padding:12px 6px;
 border-radius:10px;
 text-align:center;
}

.result-name{
 color:#9cafc5;
 font-size:11px;
}

.result-value{
 font-size:20px;
 font-weight:bold;
 margin-top:5px;
}

/* COMBOS */

.combo-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}

.combo{
 background:#091422;
 border:1px solid #263b55;
 border-radius:10px;
 padding:13px;
}

.combo-name{
 font-size:13px;
 color:#c4d2e2;
}

.combo-value{
 font-size:21px;
 font-weight:bold;
 margin-top:5px;
}

.combo.hot-combo{
 border-color:#f59e0b;
}

/* LAST 5 */

.score-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}

.score-column{
 background:#091422;
 border:1px solid #20344c;
 border-radius:11px;
 overflow:hidden;
}

.score-head{
 padding:11px;
 text-align:center;
 font-weight:bold;
 background:#14243a;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.score-item{
 padding:10px;
 text-align:center;
 border-top:1px solid #1e3046;
 font-size:17px;
 font-weight:bold;
}

.score-summary{
 text-align:center;
 color:#8fa3ba;
 font-size:12px;
 padding:9px;
 border-top:1px solid #1e3046;
}

/* OTHER */

.score-list{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
}

.likely-score{
 background:#091422;
 border:1px solid #20344c;
 padding:13px;
 border-radius:10px;
 text-align:center;
 font-size:18px;
 font-weight:bold;
}

.small{
 color:#8fa3ba;
 font-size:11px;
 margin-top:5px;
}

.xg-grid{
 display:grid;
 grid-template-columns:1fr 1fr 1fr;
 gap:8px;
}

.xg-box{
 background:#091422;
 border-radius:10px;
 padding:13px;
 text-align:center;
}

.xg-name{
 color:#91a4bb;
 font-size:11px;
}

.xg-value{
 font-size:22px;
 font-weight:bold;
 margin-top:5px;
}

.loading{
 text-align:center;
 padding:20px;
 color:#8fa3ba;
}

.error{
 color:#ff7777;
 text-align:center;
}

@media(max-width:600px){
 .result-grid{grid-template-columns:repeat(2,1fr)}
 .combo-grid{grid-template-columns:1fr}
 .score-list{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

<body>

<div class="container">

<h1>⚽ Football Predictor</h1>

<div class="subtitle">
Choose a league → choose a match → analysis appears automatically
</div>

<!-- LEAGUE -->

<div class="card">

<label>Select League</label>

<select id="leagueSelect">

<optgroup label="🏴 England">
<option value="PL">Premier League</option>
<option value="ELC">Championship</option>
</optgroup>

<optgroup label="🇪🇸 Spain">
<option value="PD">La Liga</option>
<option value="SD">Segunda Division</option>
</optgroup>

<optgroup label="🇩🇪 Germany">
<option value="BL1">Bundesliga</option>
<option value="BL2">2. Bundesliga</option>
</optgroup>

<optgroup label="🇮🇹 Italy">
<option value="SA">Serie A</option>
<option value="SB">Serie B</option>
</optgroup>

<optgroup label="🇫🇷 France">
<option value="FL1">Ligue 1</option>
<option value="FL2">Ligue 2</option>
</optgroup>

<optgroup label="🇳🇱 Netherlands">
<option value="DED">Eredivisie</option>
</optgroup>

<optgroup label="🌍 Europe">
<option value="CL">Champions League</option>
</optgroup>

</select>
</div>


<!-- MATCH -->

<div class="card">

<label>Select Match</label>

<button class="match-button" id="matchButton">
Choose a match
<span>Tap here to search and select a fixture</span>
</button>

<div id="matchInfo"></div>

</div>


<div id="analysis"></div>

</div>


<!-- DARK MATCH MODAL -->

<div class="match-modal" id="matchModal">

<div class="match-panel">

<div class="modal-head">

<b>⚽ Select Match</b>

<button class="close" id="closeModal">×</button>

</div>

<input
 class="search"
 id="matchSearch"
 placeholder="🔎 Search team..."
 autocomplete="off"
>

<div class="match-list" id="matchList"></div>

</div>
</div>


<script>

let currentMatches=[];
let fixtures=[];

const leagueSelect=
document.getElementById("leagueSelect");

const matchButton=
document.getElementById("matchButton");

const matchModal=
document.getElementById("matchModal");

const closeModal=
document.getElementById("closeModal");

const matchSearch=
document.getElementById("matchSearch");

const matchList=
document.getElementById("matchList");

const matchInfo=
document.getElementById("matchInfo");

const analysis=
document.getElementById("analysis");


// =============================
// LOAD FIXTURES
// =============================

async function loadFixtures(){

 matchButton.innerHTML=
 "Loading matches...";

 matchInfo.innerHTML="";
 analysis.innerHTML="";

 try{

  const league=leagueSelect.value;

  const response=await fetch(
   "/api/football?league="+
   encodeURIComponent(league)+
   "&t="+Date.now(),
   {cache:"no-store"}
  );

  const data=await response.json();

  if(!response.ok)
   throw new Error(
    data.error||"Could not load matches"
   );

  currentMatches=data.matches||[];

  fixtures=currentMatches
   .filter(m=>
    m.status!=="FINISHED" &&
    m.homeTeam &&
    m.awayTeam
   )
   .sort(
    (a,b)=>
    new Date(a.utcDate)-
    new Date(b.utcDate)
   );

  if(!fixtures.length){

   matchButton.innerHTML=
   "No upcoming matches";

   return;
  }

  matchButton.innerHTML=
  "⚽ Choose a match"+
  "<span>"+fixtures.length+
  " matches available</span>";

 }catch(error){

  matchButton.innerHTML=
  "Could not load matches";

  analysis.innerHTML=
  `<div class="card error">
   ${error.message}
  </div>`;
 }
}


// =============================
// OPEN MATCH PICKER
// =============================

matchButton.onclick=()=>{

 if(!fixtures.length)return;

 matchModal.classList.add("show");

 matchSearch.value="";

 renderMatches("");

 setTimeout(
  ()=>matchSearch.focus(),
  100
 );
};


// =============================
// CLOSE
// =============================

closeModal.onclick=()=>{
 matchModal.classList.remove("show");
};

matchModal.onclick=e=>{

 if(e.target===matchModal)
  matchModal.classList.remove("show");
};


// =============================
// RENDER MATCHES
// =============================

function renderMatches(search){

 const q=search.toLowerCase().trim();

 const list=fixtures.filter(m=>
  m.homeTeam.name.toLowerCase().includes(q)||
  m.awayTeam.name.toLowerCase().includes(q)
 );

 if(!list.length){

  matchList.innerHTML=
  `<div class="loading">
   No matching team found
  </div>`;

  return;
 }

 matchList.innerHTML=list.map(m=>{

  const date=
   new Date(m.utcDate).toLocaleString(
    [],
    {
     day:"2-digit",
     month:"short",
     hour:"2-digit",
     minute:"2-digit"
    }
   );

  return `
   <button
    class="match-item"
    onclick="selectMatch(${m.id})"
   >

    <div class="match-teams">
     ${m.homeTeam.name}
     <br>
     vs
     <br>
     ${m.awayTeam.name}
    </div>

    <div class="match-time">
     🕒 ${date}
    </div>

   </button>
  `;

 }).join("");
}


matchSearch.oninput=()=>{
 renderMatches(matchSearch.value);
};


// =============================
// SELECT MATCH
// =============================

function selectMatch(id){

 const match=
 fixtures.find(m=>m.id===id);

 if(!match)return;

 matchModal.classList.remove("show");

 matchButton.innerHTML=
 `${match.homeTeam.name} vs ${match.awayTeam.name}
 <span>✓ Match selected</span>`;

 matchInfo.innerHTML=`
 <div style="
  text-align:center;
  padding:15px 5px 5px;
  font-weight:bold;
  font-size:20px;
 ">
 ${match.homeTeam.name}
 <br>
 <span style="color:#8094aa;font-size:13px">VS</span>
 <br>
 ${match.awayTeam.name}
 </div>
 `;

 analyzeMatch(match);
}


// =============================
// TEAM CHECK
// =============================

function sameTeam(a,b){

 return a&&b&&
 a.toLowerCase().trim()===
 b.toLowerCase().trim();
}


// =============================
// LAST 5 GAMES
// =============================

function getLastGames(team){

 return currentMatches
 .filter(m=>
  m.status==="FINISHED" &&
  (
   sameTeam(m.homeTeam?.name,team)||
   sameTeam(m.awayTeam?.name,team)
  )
 )
 .sort(
  (a,b)=>
  new Date(b.utcDate)-
  new Date(a.utcDate)
 )
 .slice(0,5);
}


// =============================
// STATS
// =============================

function getStats(team){

 const games=getLastGames(team);

 let wins=0;
 let draws=0;
 let losses=0;
 let gf=0;
 let ga=0;
 let clean=0;
 let btts=0;
 let over25=0;

 games.forEach(m=>{

  const home=sameTeam(
   m.homeTeam.name,team
  );

  const hg=m.score.fullTime.home??0;
  const ag=m.score.fullTime.away??0;

  const tg=home?hg:ag;
  const og=home?ag:hg;

  gf+=tg;
  ga+=og;

  if(tg>og)wins++;
  else if(tg===og)draws++;
  else losses++;

  if(og===0)clean++;

  if(hg>0&&ag>0)btts++;

  if(hg+ag>2)over25++;
 });

 return{
  games:games.length,
  wins,draws,losses,
  gf,ga,
  avgGF:games.length?gf/games.length:1,
  avgGA:games.length?ga/games.length:1,
  clean,btts,over25
 };
}


// =============================
// LAST 5 GRID
// =============================

function scoreGrid(team){

 const games=getLastGames(team);

 if(!games.length)
  return `
   <div class="score-item">
    No results
   </div>
  `;

 return games.map(m=>{

  const home=sameTeam(
   m.homeTeam.name,team
  );

  const hg=m.score.fullTime.home??0;
  const ag=m.score.fullTime.away??0;

  const tg=home?hg:ag;
  const og=home?ag:hg;

  let icon="⬜";

  if(tg>og)icon="🟩";
  if(tg<og)icon="🟥";

  return `
   <div class="score-item">
    ${icon} ${tg}–${og}
   </div>
  `;

 }).join("");
}


function formSummary(team){

 const s=getStats(team);

 return `${s.wins}W ${s.draws}D ${s.losses}L`;
}


// =============================
// POISSON
// =============================

function poisson(k,l){

 let r=Math.exp(-l);

 for(let i=1;i<=k;i++)
  r*=l/i;

 return r;
}


// =============================
// ANALYSIS
// =============================

function analyzeMatch(match){

 const home=match.homeTeam.name;
 const away=match.awayTeam.name;

 const hs=getStats(home);
 const as=getStats(away);

 let hxg=
 (hs.avgGF+as.avgGA)/2;

 let axg=
 (as.avgGF+hs.avgGA)/2;

 hxg*=1.08;

 hxg*=
 1+((hs.wins-2)*.04);

 axg*=
 1+((as.wins-2)*.04);

 hxg=Math.max(.15,Math.min(5,hxg));
 axg=Math.max(.15,Math.min(5,axg));

 let homeWin=0;
 let draw=0;
 let awayWin=0;

 let over25=0;
 let under25=0;

 let btts=0;
 let noBtts=0;

 let homeScore=0;
 let awayScore=0;

 const matrix=[];

 for(let h=0;h<=8;h++){

  for(let a=0;a<=8;a++){

   const p=
   poisson(h,hxg)*
   poisson(a,axg);

   matrix.push({
    h,a,p
   });

   if(h>a)homeWin+=p;
   else if(h===a)draw+=p;
   else awayWin+=p;

   if(h+a>2)over25+=p;
   else under25+=p;

   if(h>0&&a>0)btts+=p;
   else noBtts+=p;

   if(h>0)homeScore+=p;
   if(a>0)awayScore+=p;
  }
 }

 matrix.sort(
  (a,b)=>b.p-a.p
 );

 const outcomes=[

  ["Home win",homeWin],
  ["Draw",draw],
  ["Away win",awayWin],
  ["Over 2.5",over25],
  ["Under 2.5",under25],
  ["Both score",btts],
  ["Both don't score",noBtts],
  [home+" scores",homeScore],
  [away+" scores",awayScore]

 ];

 const combos=[

  [
   "Home win + Over 1.5",
   homeWin*(
    1-
    poisson(0,hxg)
   )*
   (
    1-
    poisson(0,axg)
   )
  ],

  [
   "Home win + BTTS",
   homeWin*btts
  ],

  [
   "Home win + Over 2.5",
   homeWin*over25
  ],

  [
   "Over 2.5 + BTTS",
   over25*btts
  ],

  [
   "Home or Draw + Over 1.5",
   (homeWin+draw)*
   (
    1-
    poisson(0,hxg+axg)
   )
  ],

  [
   "Away win + Over 1.5",
   awayWin*
   (
    1-
    poisson(0,hxg+axg)
   )
  ]

 ];

 const hot=
 outcomes.reduce(
  (best,x)=>
  x[1]>best[1]?x:best
 );

 const hotCombo=
 combos.reduce(
  (best,x)=>
  x[1]>best[1]?x:best
 );

 display(
  home,
  away,
  hs,
  as,
  hxg,
  axg,
  outcomes,
  combos,
  hot,
  hotCombo,
  matrix.slice(0,3)
 );
}


// =============================
// DISPLAY
// =============================

function pct(x){
 return Math.round(
  Math.max(0,Math.min(1,x))*100
 );
}


function display(
 home,away,
 hs,as,
 hxg,axg,
 outcomes,
 combos,
 hot,
 hotCombo,
 scores
){

 analysis.innerHTML=`

 <!-- LAST 5 -->

 <div class="card">

  <div class="section-title">
   📊 Last 5 Games
  </div>

  <div class="score-grid">

   <div class="score-column">

    <div class="score-head">
     ${home}
    </div>

    ${scoreGrid(home)}

    <div class="score-summary">
     ${formSummary(home)}
    </div>

   </div>

   <div class="score-column">

    <div class="score-head">
     ${away}
    </div>

    ${scoreGrid(away)}

    <div class="score-summary">
     ${formSummary(away)}
    </div>

   </div>

  </div>

 </div>


 <!-- HOT -->

 <div class="card hot">

  <div class="hot-title">
   🔥 HOT
  </div>

  <div class="hot-name">
   ${hot[0]}
  </div>

  <div class="hot-percent">
   ${pct(hot[1])}%
  </div>

  <div class="small">
   Strongest calculated signal
  </div>

 </div>


 <!-- HOT COMBO -->

 <div class="card hot">

  <div class="hot-title">
   🔥 HOT COMBO
  </div>

  <div class="hot-name">
   ${hotCombo[0]}
  </div>

  <div class="hot-percent">
   ${pct(hotCombo[1])}%
  </div>

  <div class="small">
   Combined statistical signal
  </div>

 </div>


 <!-- POSSIBLE OUTCOMES -->

 <div class="card">

  <div class="section-title">
   🎯 Possible Outcomes
  </div>

  <div class="result-grid">

   ${outcomes.map(x=>`

    <div class="result-box">

     <div class="result-name">
      ${x[0]}
     </div>

     <div class="result-value">
      ${pct(x[1])}%
     </div>

    </div>

   `).join("")}

  </div>

 </div>


 <!-- COMBOS -->

 <div class="card">

  <div class="section-title">
   🔥 Other Combos
  </div>

  <div class="combo-grid">

   ${combos.map((x,i)=>`

    <div class="combo ${i===0?"hot-combo":""}">

     <div class="combo-name">
      ${x[0]}
     </div>

     <div class="combo-value">
      ${pct(x[1])}%
     </div>

    </div>

   `).join("")}

  </div>

 </div>


 <!-- LIKELY SCORES -->

 <div class="card">

  <div class="section-title">
   ⚽ Likely Scores
  </div>

  <div class="score-list">

   ${scores.map(s=>`

    <div class="likely-score">

     ${s.h}–${s.a}

     <div class="small">
      ${pct(s.p)}%
     </div>

    </div>

   `).join("")}

  </div>

 </div>


 <!-- XG -->

 <div class="card">

  <div class="section-title">
   📈 Expected Goals
  </div>

  <div class="xg-grid">

   <div class="xg-box">

    <div class="xg-name">
     ${home}
    </div>

    <div class="xg-value">
     ${hxg.toFixed(2)}
    </div>

   </div>

   <div class="xg-box">

    <div class="xg-name">
     TOTAL xG
    </div>

    <div class="xg-value">
     ${(hxg+axg).toFixed(2)}
    </div>

   </div>

   <div class="xg-box">

    <div class="xg-name">
     ${away}
    </div>

    <div class="xg-value">
     ${axg.toFixed(2)}
    </div>

   </div>

  </div>

 </div>


 <div class="card">

  <div class="small" style="text-align:center">
   ⚠️ Predictions are statistical estimates,
   not guaranteed results.
  </div>

 </div>

 `;
}


// =============================
// LEAGUE CHANGE
// =============================

leagueSelect.onchange=loadFixtures;


// =============================
// START
// =============================

loadFixtures();

</script>

</body>
</html>
